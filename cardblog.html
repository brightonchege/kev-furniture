<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Stories - Thank Ewe Very Much</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #fff8f1 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150"><path d="M20,75 C20,110 75,130 75,130 C75,130 130,110 130,75 C130,40 75,20 75,20 C75,20 20,40 20,75 Z" fill="none" stroke="%23ff6f61" stroke-width="2" opacity="0.2" /><path d="M30,75 C30,100 75,120 75,120 C75,120 120,100 120,75 C120,50 75,30 75,30 C75,30 30,50 30,75 Z" fill="none" stroke="%23ffd166" stroke-width="2" opacity="0.2" /><path d="M40,75 C40,95 75,110 75,110 C75,110 110,95 110,75 C110,55 75,40 75,40 C75,40 40,55 40,75 Z" fill="none" stroke="%234ecdc4" stroke-width="2" opacity="0.2" /><path d="M50,75 C50,90 75,100 75,100 C75,100 100,90 100,75 C100,60 75,50 75,50 C75,50 50,60 50,75 Z" fill="none" stroke="%23a78bfa" stroke-width="2" opacity="0.2" /><path d="M60,75 C60,85 75,90 75,90 C75,90 90,85 90,75 C90,65 75,60 75,60 C75,60 60,65 60,75 Z" fill="none" stroke="%23f472b6" stroke-width="2" opacity="0.2" /></svg>') repeat;
            margin: 0;
            overflow-x: hidden;
        }
        .lte-navbar {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }
        .lte-logo img {
            max-height: 60px;
            transition: transform 0.3s ease;
        }
        .lte-logo img:hover {
            transform: scale(1.1);
        }
        .lte-ul-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .lte-ul-nav li {
            position: relative;
        }
        .lte-ul-nav a {
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .lte-ul-nav a:hover {
            color: #ff6f61;
        }
        .sub-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 1rem;
            min-width: 200px;
            z-index: 1000;
        }
        .menu-item-has-children:hover .sub-menu {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        .sub-menu li {
            padding: 0.5rem 0;
        }
        .sub-menu a {
            color: #333;
            font-size: 1rem;
            display: block;
            padding: 0.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .sub-menu a:hover {
            color: #ff6f61;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .lte-btn {
            background-color: #ff6f61;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .lte-btn:hover {
            background-color: #e55a50;
            transform: scale(1.05);
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
            padding: 0.5rem;
        }
        .hamburger span {
            width: 30px;
            height: 4px;
            background-color: #ff6f61;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }
        .mobile-menu {
            display: none;
            background: rgba(255, 255, 255, 0.98);
            padding: 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            overflow-y: auto;
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-menu.active {
            display: block;
            transform: translateY(0);
        }
        .mobile-menu .lte-ul-nav {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .mobile-menu .lte-ul-nav li {
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        .mobile-menu .lte-ul-nav a {
            font-size: 1.2rem;
            color: #333;
            font-weight: 600;
        }
        .mobile-menu .sub-menu {
            position: static;
            box-shadow: none;
            padding: 1rem 1.5rem;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .mobile-menu .sub-menu a {
            font-size: 1rem;
        }
        .mobile-menu .menu-item-has-children > a::after {
            content: '▼';
            display: inline-block;
            margin-left: 0.5rem;
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }
        .mobile-menu .menu-item-has-children.active > a::after {
            transform: rotate(180deg);
        }
        .close-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: #ff6f61;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .close-menu:hover {
            background-color: #e55a50;
        }
        .section-bg {
            position: relative;
            overflow: hidden;
        }
        .card-shadow {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .card-shadow:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background-color: #ff6f61;
            color: white;
            border-radius: 25px;
            padding: 10px 20px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #e55a50;
            transform: scale(1.05);
        }
        .highlight-text {
            color: #ff6f61;
        }
        .story-post {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .story-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }
        .story-post h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .story-post .date {
            font-size: 0.9rem;
            color: #ff6f61;
            margin-bottom: 1rem;
        }
        .story-post p {
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .story-post .read-more {
            color: #ff6f61;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }
        .story-post .read-more:hover {
            color: #e55a50;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .popup-content {
            background: #fefefe url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150"><path d="M20,75 C20,110 75,130 75,130 C75,130 130,110 130,75 C130,40 75,20 75,20 C75,20 20,40 20,75 Z" fill="none" stroke="%23ff6f61" stroke-width="2" opacity="0.2" /><path d="M30,75 C30,100 75,120 75,120 C75,120 120,100 120,75 C120,50 75,30 75,30 C75,30 30,50 30,75 Z" fill="none" stroke="%23ffd166" stroke-width="2" opacity="0.2" /><path d="M40,75 C40,95 75,110 75,110 C75,110 110,95 110,75 C110,55 75,40 75,40 C75,40 40,55 40,75 Z" fill="none" stroke="%234ecdc4" stroke-width="2" opacity="0.2" /><path d="M50,75 C50,90 75,100 75,100 C75,100 100,90 100,75 C100,60 75,50 75,50 C75,50 50,60 50,75 Z" fill="none" stroke="%23a78bfa" stroke-width="2" opacity="0.2" /><path d="M60,75 C60,85 75,90 75,90 C75,90 90,85 90,75 C90,65 75,60 75,60 C75,60 60,65 60,75 Z" fill="none" stroke="%23f472b6" stroke-width="2" opacity="0.2" /></svg>') repeat;
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
            position: relative;
            transform: scale(0.7);
            transition: transform 0.3s ease;
            border: 2px solid #4ecdc4;
        }
        .popup-overlay.active .popup-content {
            transform: scale(1);
        }
        .popup-content h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .popup-content .date {
            font-size: 0.9rem;
            color: #ff6f61;
            margin-bottom: 1rem;
        }
        .popup-content p {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .popup-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ff6f61;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .popup-close:hover {
            background-color: #e55a50;
        }
        .custom-form input, .custom-form select, .custom-form textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        .custom-form label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            display: block;
        }
        .popup-content .btn-primary {
            background-color: #4ecdc4;
        }
        .popup-content .btn-primary:hover {
            background-color: #45b7aa;
        }
        footer {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            padding: 3rem 1rem;
        }
        footer p {
            font-size: 1rem;
            opacity: 0.9;
        }
        @media (max-width: 1024px) {
            .lte-ul-nav {
                gap: 1rem;
            }
            .lte-ul-nav a {
                font-size: 1rem;
            }
            .lte-btn {
                padding: 6px 12px;
                font-size: 0.9rem;
            }
            .popup-content {
                max-width: 500px;
            }
        }
        @media (max-width: 768px) {
            .lte-ul-nav {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .mobile-menu.active .lte-ul-nav {
                display: flex;
            }
            .story-post h3 {
                font-size: 1.5rem;
            }
            .story-post p {
                font-size: 0.9rem;
            }
            .popup-content {
                max-width: 90%;
            }
            .popup-content h3 {
                font-size: 1.5rem;
            }
            .popup-content p {
                font-size: 0.9rem;
            }
        }
        @media (max-width: 480px) {
            .lte-logo img {
                max-height: 40px;
            }
            .btn-primary {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            .story-post h3 {
                font-size: 1.3rem;
            }
            .story-post p {
                font-size: 0.8rem;
            }
            .story-post .date {
                font-size: 0.8rem;
            }
            .mobile-menu .lte-ul-nav a {
                font-size: 1.1rem;
            }
            .mobile-menu .sub-menu a {
                font-size: 0.9rem;
            }
            .popup-content {
                padding: 1rem;
            }
            .popup-content h3 {
                font-size: 1.3rem;
            }
            .popup-content p {
                font-size: 0.8rem;
            }
            .popup-content .date {
                font-size: 0.8rem;
            }
            .custom-form input, .custom-form select, .custom-form textarea {
                font-size: 0.9rem;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function Navbar() {
            const [menuOpen, setMenuOpen] = useState(false);
            const [activeSubMenu, setActiveSubMenu] = useState(null);
            const [showCustomOrder, setShowCustomOrder] = useState(false);

            const toggleMenu = () => {
                setMenuOpen(!menuOpen);
                if (!menuOpen) {
                    setActiveSubMenu(null);
                }
            };

            const toggleSubMenu = (index) => {
                setActiveSubMenu(activeSubMenu === index ? null : index);
            };

            const handleCustomOrderClick = () => {
                setShowCustomOrder(true);
                setMenuOpen(false);
            };

            useEffect(() => {
                gsap.from('.lte-ul-nav li', {
                    opacity: 0,
                    y: -20,
                    stagger: 0.1,
                    duration: 0.5,
                    ease: 'power2.out',
                    delay: 0.3,
                });
                gsap.from('.lte-logo img', {
                    opacity: 0,
                    scale: 0.8,
                    duration: 0.8,
                    ease: 'elastic.out(1, 0.5)',
                });
                gsap.from('.mobile-menu .lte-ul-nav li', {
                    opacity: 0,
                    y: -20,
                    stagger: 0.1,
                    duration: 0.5,
                    ease: 'power2.out',
                    delay: 0.2,
                    scrollTrigger: {
                        trigger: '.mobile-menu',
                        start: 'top top',
                    },
                });
            }, []);

            return (
                <nav className="fixed w-full lte-navbar text-gray-800 py-4 z-10 border-b border-gray-200">
                    <div className="container mx-auto px-4 flex justify-between items-center">
                        <div className="lte-navbar-logo">
                            <a className="lte-logo" href="index.html#home">
                                <img src="https://via.placeholder.com/150x60?text=Thank+Ewe+Very+Much" alt="Thank Ewe Very Much" />
                            </a>
                        </div>
                        <div className={`hamburger md:hidden ${menuOpen ? 'active' : ''}`} onClick={toggleMenu}>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <ul id="menu-main-menu" className={`lte-ul-nav hidden md:flex`}>
                            <li className="menu-item menu-item-has-children">
                                <a href="card.html#home">Home</a>
                                <ul className="sub-menu">
                                    <li><a href="card.html#home">Main Home</a></li>
                                    <li><a href="card.html#products">Featured Cards</a></li>
                                </ul>
                            </li>
                            <li className="menu-item">
                                <a href="index.html#about">About Us</a>
                            </li>
                            <li className="menu-item menu-item-has-children">
                                <a href="index.html#products">Shop</a>
                                <ul className="sub-menu">
                                    <li><a href="index.html#products">All Cards</a></li>
                                    <li><a href="index.html#products">Birthday Cards</a></li>
                                    <li><a href="index.html#products">Thank You Cards</a></li>
                                    <li><a href="index.html#products">Special Occasion Cards</a></li>
                                    <li><a href="index.html#custom-order">Custom Orders</a></li>
                                    <li><a href="index.html#cart">Cart</a></li>
                                    <li><a href="index.html#checkout">Checkout</a></li>
                                </ul>
                            </li>
                            <li className="menu-item">
                                <a href="stories.html">Stories</a>
                            </li>
                            <li><a href="index.html#contacts">Contacts</a></li>
                            <li><a href="#" onClick={handleCustomOrderClick}>Book Custom Card</a></li>
                        </ul>
                        <ul className="lte-navbar-icons-add hidden md:flex">
                            <li><a href="index.html#products" className="lte-btn">Shop Now</a></li>
                        </ul>
                    </div>
                    <div className={`mobile-menu ${menuOpen ? 'active' : ''}`}>
                        <div className="close-menu" onClick={toggleMenu}>×</div>
                        <ul id="menu-main-menu" className="lte-ul-nav">
                            <li className={`menu-item menu-item-has-children ${activeSubMenu === 0 ? 'active' : ''}`}>
                                <a href="index.html#home" onClick={() => toggleSubMenu(0)}>Home</a>
                                <ul className="sub-menu" style={{ display: activeSubMenu === 0 ? 'block' : 'none' }}>
                                    <li><a href="index.html#home">Main Home</a></li>
                                    <li><a href="index.html#products">Featured Cards</a></li>
                                </ul>
                            </li>
                            <li className="menu-item">
                                <a href="index.html#about">About Us</a>
                            </li>
                            <li className={`menu-item menu-item-has-children ${activeSubMenu === 1 ? 'active' : ''}`}>
                                <a href="index.html#products" onClick={() => toggleSubMenu(1)}>Shop</a>
                                <ul className="sub-menu" style={{ display: activeSubMenu === 1 ? 'block' : 'none' }}>
                                    <li><a href="index.html#products">All Cards</a></li>
                                    <li><a href="index.html#products">Birthday Cards</a></li>
                                    <li><a href="index.html#products">Thank You Cards</a></li>
                                    <li><a href="index.html#products">Special Occasion Cards</a></li>
                                    <li><a href="index.html#custom-order">Custom Orders</a></li>
                                    <li><a href="index.html#cart">Cart</a></li>
                                    <li><a href="index.html#checkout">Checkout</a></li>
                                </ul>
                            </li>
                            <li className="menu-item">
                                <a href="stories.html">Stories</a>
                            </li>
                            <li className="menu-item">
                                <a href="index.html#contacts">Contacts</a>
                            </li>
                            <li className="menu-item">
                                <a href="#" onClick={handleCustomOrderClick}>Book Custom Card</a>
                            </li>
                            <li className="menu-item">
                                <a href="index.html#products" className="lte-btn w-full text-center">Shop Now</a>
                            </li>
                        </ul>
                    </div>
                    {showCustomOrder && <CustomOrderPopup onClose={() => setShowCustomOrder(false)} />}
                </nav>
            );
        }

        function StoryPopup({ story, onClose }) {
            useEffect(() => {
                gsap.from('.popup-content', {
                    opacity: 0,
                    scale: 0.7,
                    duration: 0.5,
                    ease: 'power3.out',
                });
            }, []);

            if (!story) return null;

            return (
                <div className="popup-overlay active">
                    <div className="popup-content card-shadow">
                        <div className="popup-close" onClick={onClose}>×</div>
                        <h3>{story.title}</h3>
                        <p className="date">{story.date}</p>
                        <p>{story.excerpt}</p>
                        <p>{story.full}</p>
                        <p className="text-sm text-gray-600 mt-2">Share your story at <a href="mailto:info@thankeweverymuch.com" className="highlight-text">info@thankeweverymuch.com</a>! #RealCardsRealPeople</p>
                    </div>
                </div>
            );
        }

        function CustomOrderPopup({ onClose }) {
            useEffect(() => {
                gsap.from('.popup-content', {
                    opacity: 0,
                    scale: 0.7,
                    duration: 0.5,
                    ease: 'power3.out',
                });
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                alert('Custom order submitted! We’ll contact you to confirm your 25% deposit.');
                onClose();
            };

            return (
                <div className="popup-overlay active">
                    <div className="popup-content card-shadow">
                        <div className="popup-close" onClick={onClose}>×</div>
                        <h3 className="text-2xl font-bold mb-4">Book Your Custom Card</h3>
                        <p className="text-gray-600 mb-4">Create a woolly masterpiece! Orders require a 25% deposit and 4 weeks lead time.</p>
                        <div className="custom-form">
                            <label htmlFor="name">Your Name</label>
                            <input type="text" id="name" placeholder="Enter your name" required />
                            <label htmlFor="email">Email Address</label>
                            <input type="email" id="email" placeholder="Enter your email" required />
                            <label htmlFor="card-type">Card Type</label>
                            <select id="card-type" required>
                                <option value="">Select card type</option>
                                <option value="birthday">Birthday</option>
                                <option value="thank-you">Thank You</option>
                                <option value="special-occasion">Special Occasion</option>
                                <option value="other">Other</option>
                            </select>
                            <label htmlFor="message">Custom Message</label>
                            <textarea id="message" rows="4" placeholder="Your custom message" required></textarea>
                            <label htmlFor="quantity">Quantity</label>
                            <input type="number" id="quantity" min="1" placeholder="Enter quantity" required />
                            <button onClick={handleSubmit} className="btn-primary mt-4">Submit Order</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Stories() {
            const [selectedStory, setSelectedStory] = useState(null);
            const [showCustomOrder, setShowCustomOrder] = useState(false);

            const handleStoryClick = (story) => {
                setSelectedStory(story);
            };

            const handleClosePopup = () => {
                setSelectedStory(null);
            };

            const handleCustomOrderClick = () => {

            useEffect(() => {

                    stagger: 0.2,

                    ease: 'power3.out',
                    scrollTrigger: {
                        trigger: '#stories',
                        start: 'top 80%',
                    },
                });
                gsap.from('.stories-header', {
                    opacity: 0,
                    y: 20,
                    duration: 0.8,
                    ease: 'power3.out',
                    scrollTrigger: {
                        trigger: '#stories',
                        start: 'top 80%',
                    },
                });

            const stories = [
                {
                    title: "A Llama Birthday Surprise",
                    date: "October 5, 2025",
                    excerpt: "Sarah ordered our 'Llama Birthday Bash' card for her best friend’s 30th. The woolly design brought tears of joy! #RealCardsRealPeople",
                    full: "Sarah wanted something special for her friend’s milestone birthday. She chose our colorful llama-themed card, and the heartfelt message inside made the day unforgettable."

                {
                    title: "Thank Ewe for the Memories",
                    date: "September 20, 2025",
                    excerpt: "James sent a custom 'Thank Ewe Note' to his mentor after a promotion. The 4-week process was worth it for the personal touch!",

                },

                    title: "A Woolly Wedding Wish",
                    date: "September 10, 2025",

                },
                {
                    title: "Healing with Llama Love",
                    date: "August 25, 2025",
                    excerpt: "Mark sent a 'Get Well Llama' card to his recovering aunt. The cheerful design lifted her spirits during tough times.",
                    full: "Mark chose our 'Get Well Llama' card to brighten his aunt’s hospital stay. The woolly design and heartfelt message brought a smile."
                }
            ];

            // Option to add more stories: Extend the stories array with new objects in the format { title, date, excerpt, full }

            return (
                <section id="stories" className="py-16 section-bg text-gray-800">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-12 stories-header">
                            <h2 className="text-4xl font-bold mb-4">Card Stories from Real People</h2>
                            <p className="text-lg text-gray-600">
                                Heartwarming tales of how our <span className="highlight-text">woolly cards</span> made a difference. Share your story at <a href="mailto:info@thankeweverymuch.com" className="highlight-text">info@thankeweverymuch.com</a>! #RealCardsRealPeople

                            <p className="text-lg text-gray-600 mt-2">Custom orders require a 25% deposit and 4 weeks lead time.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {stories.map((story, index) => (
                                <div key={index} className="story-post card-shadow" onClick={() => handleStoryClick(story)}>

                                    <p className="date">{story.date}</p>
                                    <p>{story.excerpt}</p>

                            <button onClick={handleCustomOrderClick} className="btn-primary mt-4 inline-block">Book a Custom Card</button>

                        {selectedStory && <StoryPopup story={selectedStory} onClose={handleClosePopup} />}
                        {showCustomOrder && <CustomOrderPopup onClose={handleCloseCustomOrder} />}

            useEffect(() => {
                gsap.from('footer p', {
                    opacity: 0,
                    y: 20,
                    stagger: 0.2,
                    duration: 0.8,
                    ease: 'power2.out',
                    scrollTrigger: {
                        trigger: 'footer',
                        start: 'top 80%',
                    },
                });
            }, []);

            return (
                <footer id="contacts" className="bg-gray-900 text-white py-8 text-center">
                    <p className="text-lg">&copy; 2025 Thank Ewe Very Much. All rights reserved.</p>
                    <p className="text-lg mt-2">Real Cards for Real People! #ThankEweVeryMuch #SnailMail</p>
                    <p className="text-lg mt-2">Follow us on <a href="https://x.com" className="highlight-text">#RealCardsRealPeople</a></p>
                    <p className="text-lg mt-2">Contact us: <a href="mailto:info@thankeweverymuch.com" className="highlight-text">info@thankeweverymuch.com</a></p>
                    <p className="text-lg mt-2">Phone: (123) 456-7890 | Address: 123 Llama Lane, Woolville, USA</p>

        root.render(<App />);
